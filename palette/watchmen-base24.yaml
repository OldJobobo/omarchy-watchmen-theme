system: "base24"
name: "Watchmen Higgins 64"
slug: "watchmen-higgins-64"
author: "OldJobobo, based on John Higgins' Watchmen palette"
variant: "dark"

palette:
  # --- wet ink / printed paper ramp ---
  base00: "#2C2D37" # Panel Ink       - default background; Higgins 64 R6C1
  base01: "#55595D" # Wet Concrete    - lighter background; Higgins 64 R6C2
  base02: "#3A5F87" # Cold Frame      - selection background; Higgins 64 R4C9
  base03: "#6E7B8C" # Steel Rain      - comments / muted text; Higgins 64 R4C5
  base04: "#9C9C9E" # Newsprint Gray  - dark foreground; Higgins 64 R4C4
  base05: "#CEB8B0" # Aged Paper      - default foreground; Higgins 64 R2C4
  base06: "#DFC0B0" # Paper Highlight - light foreground; Higgins 64 R2C7
  base07: "#DFC0B0" # Flash Panel     - brightest foreground; Higgins 64 R2C7

  # --- city warning / impossible blue accents ---
  base08: "#C13E46" # Warning Blood   - red / error; Higgins 64 R5C6
  base09: "#A86A3E" # Rust Signal     - orange / warning; Higgins 64 R5C4
  base0A: "#D2833B" # Street Amber    - yellow; Higgins 64 R5C5
  base0B: "#ADC4B3" # Archive Sage    - green; Higgins 64 R1C7
  base0C: "#238E9E" # Cold Static     - cyan; Higgins 64 R1C9
  base0D: "#2488CB" # Manhattan Blue  - blue / focus; Higgins 64 R3C6
  base0E: "#9287B0" # Bruised Violet  - purple; Higgins 64 R3C8
  base0F: "#81544E" # Oxidized Brick  - brown / special; Higgins 64 R7C7

  # --- base24 extension ---
  base10: "#242949" # Midnight Panel  - darker background; Higgins 64 R6C7
  base11: "#1F1D3C" # Rorschach Ink   - darkest background; Higgins 64 R7C4
  base12: "#D8979A" # Blood on Paper  - bright red; Higgins 64 R2C8
  base13: "#D2833B" # Alarm Amber     - bright orange / yellow; Higgins 64 R5C5
  base14: "#A8BFB8" # Faded Evidence - bright green; Higgins 64 R1C4
  base15: "#8EB3C0" # Rainlit Cyan    - bright cyan; Higgins 64 R1C1
  base16: "#64A2BD" # Electric Glass - bright blue; Higgins 64 R1C2
  base17: "#B1A9C2" # Mauve Flash    - bright purple; Higgins 64 R5C2
